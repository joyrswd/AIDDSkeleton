name: Bug report
description: Report a reproducible problem with the AIDD Skeleton template
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide enough detail for someone else to reproduce and verify it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong, and what should happen instead?
      placeholder: Describe the problem and expected result.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Repository structure
        - Agent instructions
        - Definitions and documentation
        - Execution environment
        - Jobs or references
        - Products and verification
        - README or contribution guidance
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Create a repository from the template
        2. Open it in ...
        3. Ask the agent to ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the AI development environment, model, operating system, and relevant versions.
      placeholder: Codex / model / OS / other relevant details
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, screenshots, repository links, or other verification evidence. Remove secrets and personal information.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add anything else that may help diagnose the problem.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked that this problem is not already reported in an open issue.
          required: true
        - label: I removed credentials, personal information, and confidential values from the report.
          required: true
